[package]
name = "rust-slint-password-saver"
version = "0.1.0"
edition = "2021"
authors = ["obstreperous-ai"]
description = "A cross-platform desktop password saver application using Slint UI"
license = "MIT"
repository = "https://github.com/obstreperous-ai/rust-slint-password-saver"
keywords = ["password-manager", "encryption", "slint", "desktop"]
categories = ["cryptography", "gui"]

[dependencies]
slint = "1.14"
argon2 = "0.5.3"
aes-gcm = "0.10.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
lazy_static = "1.5"
zxcvbn = "3.1"
log = "0.4"
env_logger = "0.11"
hmac = "0.12"
sha2 = "0.10"
hostname = "0.4"
hex = "0.4"
zeroize = { version = "1.8", features = ["derive"] }
subtle = "2.6"
rand = "0.8"
arboard = "3.4"

[build-dependencies]
slint-build = "1.14"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.52", features = ["Win32_Storage_FileSystem", "Win32_Security", "Win32_Foundation", "Win32_System_Threading", "Win32_Security_Authorization"] }

[lints.clippy]
# Pedantic lints for better code quality (as warnings, not errors)
pedantic = { level = "warn", priority = -1 }

# Allow some pedantic lints that may be too strict
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
uninlined_format_args = "allow"
items_after_statements = "allow"
