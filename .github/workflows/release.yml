    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.asset_name }}
        path: ${{ matrix.asset_name }}.${{ matrix.archive_ext }}
  
  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4
    
    - name: Download all artifacts
      uses: actions/download-artifact@v4.1.3
      with:
        path: ./artifacts
    
    - name: Display structure of downloaded files
      run: ls -R ./artifacts
    
    - name: Generate SHA-256 checksums
      run: |
        cd ./artifacts
        # sha256sum outputs "<hash>  <path>"; strip the leading "./<artifact-dir>/" prefix
        # so the final SHA256SUMS.txt contains clean "hash  filename" lines.
        find . -type f \( -name "*.tar.gz" -o -name "*.zip" -o -name "*.msi" \) | sort | while read -r f; do
          sha256sum "$f" | sed 's|^\([a-f0-9]*\)  \./[^/]*/\(.*\)|\1  \2|' >> ../SHA256SUMS.txt
        done
        cd ..
        echo "Generated SHA256SUMS.txt:"
        cat SHA256SUMS.txt

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        files: |
          ./artifacts/**/*.tar.gz
          ./artifacts/**/*.zip
          ./artifacts/**/*.msi
          SHA256SUMS.txt
        draft: false
        prerelease: false
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
