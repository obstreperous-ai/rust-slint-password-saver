name: Release

on:
  push:
    tags:
      - 'v*.*.*'

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build Release
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: rust-slint-password-saver
            asset_name: rust-slint-password-saver-linux-x86_64
            archive_ext: tar.gz
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact_name: rust-slint-password-saver
            asset_name: rust-slint-password-saver-macos-x86_64
            archive_ext: tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: rust-slint-password-saver
            asset_name: rust-slint-password-saver-macos-aarch64
            archive_ext: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: rust-slint-password-saver.exe
            asset_name: rust-slint-password-saver-windows-x86_64
            archive_ext: zip
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install system dependencies (Ubuntu)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake libfontconfig1-dev libxcb-shape0-dev libxcb-xfixes0-dev
    
    - name: Install system dependencies (macOS)
      if: runner.os == 'macOS'
      run: |
        brew install cmake
    
    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: ${{ matrix.target }}
    
    - name: Build release binary
      run: cargo build --release --target ${{ matrix.target }}
    
    - name: Strip binary (Linux)
      if: runner.os == 'Linux'
      run: strip target/${{ matrix.target }}/release/${{ matrix.artifact_name }}
    
    - name: Strip binary (macOS)
      if: runner.os == 'macOS'
      run: strip target/${{ matrix.target }}/release/${{ matrix.artifact_name }}
    
    - name: Create tarball (Linux and macOS)
      if: runner.os != 'Windows'
      run: |
        cd target/${{ matrix.target }}/release
        tar czf ${{ matrix.asset_name }}.tar.gz ${{ matrix.artifact_name }}
        mv ${{ matrix.asset_name }}.tar.gz ../../../
    
    - name: Create zip (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        Compress-Archive -Path "target/${{ matrix.target }}/release/${{ matrix.artifact_name }}" `
          -DestinationPath "${{ matrix.asset_name }}.zip"

    - name: Build WiX installer (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        # Install the WiX 4 .NET global tool and UI extension
        dotnet tool install --global wix
        wix extension add --global WixToolset.UI.wixext
        # Build the .msi installer; ExeSource points to the compiled release binary
        wix build `
          -d "ExeSource=target/${{ matrix.target }}/release/${{ matrix.artifact_name }}" `
          -ext WixToolset.UI.wixext `
          -o "${{ matrix.asset_name }}.msi" `
          installer/windows/main.wxs

    - name: Upload MSI artifact (Windows)
      if: runner.os == 'Windows'
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.asset_name }}-installer
        path: ${{ matrix.asset_name }}.msi

    # TODO: Add Authenticode code-signing for the Windows binary to prevent SmartScreen from
    # blocking the executable on first launch (Finding D in WINDOWS.md).
    #
    # Option A — Microsoft Trusted Signing (recommended, no hardware token required):
    #   - name: Sign Windows binary (Microsoft Trusted Signing)
    #     if: runner.os == 'Windows'
