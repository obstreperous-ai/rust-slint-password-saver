name: Release

on:
  push:
    tags:
      - 'v*.*.*'

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build Release
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    env:
      # Authenticode signing credentials — set these secrets in Settings → Secrets and variables → Actions
      # to enable automatic signing of the Windows release binary.  When any of these are absent the
      # signing step is skipped gracefully; see WINDOWS.md "Code Signing" subsection for setup details.
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      TRUSTED_SIGNING_ACCOUNT_NAME: ${{ secrets.TRUSTED_SIGNING_ACCOUNT_NAME }}
      TRUSTED_SIGNING_CERTIFICATE_PROFILE_NAME: ${{ secrets.TRUSTED_SIGNING_CERTIFICATE_PROFILE_NAME }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: rust-slint-password-saver
            asset_name: rust-slint-password-saver-linux-x86_64
            archive_ext: tar.gz
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact_name: rust-slint-password-saver
            asset_name: rust-slint-password-saver-macos-x86_64
            archive_ext: tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: rust-slint-password-saver
            asset_name: rust-slint-password-saver-macos-aarch64
            archive_ext: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: rust-slint-password-saver.exe
            asset_name: rust-slint-password-saver-windows-x86_64
            archive_ext: zip
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install system dependencies (Ubuntu)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake libfontconfig1-dev libxcb-shape0-dev libxcb-xfixes0-dev
    
    - name: Install system dependencies (macOS)
      if: runner.os == 'macOS'
      run: |
        brew install cmake
    
    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: ${{ matrix.target }}
    
    - name: Build release binary
      run: cargo build --release --target ${{ matrix.target }}
    
    - name: Strip binary (Linux)
      if: runner.os == 'Linux'
      run: strip target/${{ matrix.target }}/release/${{ matrix.artifact_name }}
    
    - name: Strip binary (macOS)
      if: runner.os == 'macOS'
      run: strip target/${{ matrix.target }}/release/${{ matrix.artifact_name }}
    
    # Sign the Windows binary BEFORE packaging so the zip and MSI both contain the signed
    # executable.  The step is skipped automatically when the AZURE_TENANT_ID secret is not
    # configured; no changes to the workflow file are needed when adding the secret later.
    # See WINDOWS.md "Code Signing" subsection for provider options, cost estimates, and
    # the required GitHub Actions secrets.
    - name: Sign Windows binary (Microsoft Trusted Signing)
      if: runner.os == 'Windows' && env.AZURE_TENANT_ID != ''
      uses: azure/trusted-signing-action@v0.5.1
      with:
        azure-tenant-id: ${{ env.AZURE_TENANT_ID }}
        azure-client-id: ${{ env.AZURE_CLIENT_ID }}
        azure-client-secret: ${{ env.AZURE_CLIENT_SECRET }}
        endpoint: https://eus.codesigning.azure.net/
        trusted-signing-account-name: ${{ env.TRUSTED_SIGNING_ACCOUNT_NAME }}
        certificate-profile-name: ${{ env.TRUSTED_SIGNING_CERTIFICATE_PROFILE_NAME }}
        files-folder: target/${{ matrix.target }}/release
        files-folder-filter: exe
        file-digest: SHA256
        timestamp-rfc3161: http://timestamp.acs.microsoft.com
        timestamp-digest: SHA256

    # TODO: Option B — EV certificate via signtool.exe (alternative, requires a PFX secret):
    #   - name: Sign Windows binary (signtool / EV certificate)
    #     if: runner.os == 'Windows'
    #     shell: pwsh
    #     run: |
    #       $pfxBytes = [Convert]::FromBase64String("${{ secrets.CODE_SIGNING_CERT_PFX_BASE64 }}")
    #       $pfxPath  = "$env:RUNNER_TEMP\codesign.pfx"
    #       [IO.File]::WriteAllBytes($pfxPath, $pfxBytes)
    #       signtool sign /fd SHA256 /p "${{ secrets.CODE_SIGNING_CERT_PASSWORD }}" `
    #         /f "$pfxPath" `
    #         /t http://timestamp.digicert.com `
    #         "target/${{ matrix.target }}/release/${{ matrix.artifact_name }}"
    #       Remove-Item -Force "$pfxPath"

    - name: Create tarball (Linux and macOS)
      if: runner.os != 'Windows'
      run: |
        cd target/${{ matrix.target }}/release
        tar czf ${{ matrix.asset_name }}.tar.gz ${{ matrix.artifact_name }}
        mv ${{ matrix.asset_name }}.tar.gz ../../../
    
    - name: Create zip (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        Compress-Archive -Path "target/${{ matrix.target }}/release/${{ matrix.artifact_name }}" `
          -DestinationPath "${{ matrix.asset_name }}.zip"

    - name: Build WiX installer (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        # Install the WiX 4 .NET global tool and UI extension
        dotnet tool install --global wix
        wix extension add --global WixToolset.UI.wixext
        # Build the .msi installer; ExeSource points to the compiled release binary
        wix build `
          -d "ExeSource=target/${{ matrix.target }}/release/${{ matrix.artifact_name }}" `
          -ext WixToolset.UI.wixext `
          -o "${{ matrix.asset_name }}.msi" `
          installer/windows/main.wxs

    - name: Upload MSI artifact (Windows)
      if: runner.os == 'Windows'
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.asset_name }}-installer
        path: ${{ matrix.asset_name }}.msi
    
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.asset_name }}
        path: ${{ matrix.asset_name }}.${{ matrix.archive_ext }}
  
  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: stable

    - name: Install cargo-sbom
      run: cargo install cargo-sbom --locked

    - name: Generate SBOM (SPDX JSON)
      run: |
        set -e
        cargo sbom --output-format spdx_json_2_3 > sbom.spdx.json
        test -s sbom.spdx.json || { echo "ERROR: sbom.spdx.json is empty or missing"; exit 1; }
        echo "SBOM generated successfully ($(wc -c < sbom.spdx.json) bytes)"

    - name: Download all artifacts
      uses: actions/download-artifact@v4.1.3
      with:
        path: ./artifacts
    
    - name: Display structure of downloaded files
      run: ls -R ./artifacts
    
    - name: Generate SHA-256 checksums
      run: |
        cd ./artifacts
        # sha256sum outputs "<hash>  <path>"; strip the leading "./<artifact-dir>/" prefix
        # so the final SHA256SUMS.txt contains clean "hash  filename" lines.
        find . -type f \( -name "*.tar.gz" -o -name "*.zip" -o -name "*.msi" \) | sort | while read -r f; do
          sha256sum "$f" | sed 's|^\([a-f0-9]*\)  \./[^/]*/\(.*\)|\1  \2|' >> ../SHA256SUMS.txt
        done
        cd ..
        echo "Generated SHA256SUMS.txt:"
        cat SHA256SUMS.txt

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        files: |
          ./artifacts/**/*.tar.gz
          ./artifacts/**/*.zip
          ./artifacts/**/*.msi
          SHA256SUMS.txt
          sbom.spdx.json
        draft: false
        prerelease: false
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
